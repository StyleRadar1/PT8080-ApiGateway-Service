name: CD QA · PT8080-ApiGateway-Service

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  IMAGE_NAME: pt8080-apigateway-service

jobs:
  test-and-sonar:
    name: Pruebas, Cobertura JaCoCo (>= 85%) y SonarCloud (Gate A)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Otorgar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas y verificar cobertura JaCoCo (>= 85%)
        run: ./mvnw -B clean verify

      - name: Ejecutar análisis SonarQube / SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-qa
          path: target/site/jacoco/

  build-push-qa:
    name: Construir y publicar imagen QA en Docker Hub
    needs: test-and-sonar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Despliegue en Azure App Service QA (styleradar-gateway-qa)
    needs: build-push-qa
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://${{ secrets.AZURE_WEBAPP_GATEWAY_QA || 'styleradar-gateway-qa' }}.azurewebsites.net/swagger-ui.html
    steps:
      - uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar variables de entorno del App Service QA
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          APP_NAME: ${{ secrets.AZURE_WEBAPP_GATEWAY_QA || 'styleradar-gateway-qa' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            RG=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
            if [ -n "$RG" ] && [ "$RG" != "null" ]; then
              az webapp config appsettings set \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --output none \
                --settings \
                  WEBSITES_PORT=8080 \
                  SERVER_PORT=8080 \
                  SPRING_PROFILES_ACTIVE=qa \
                  JWT_SECRET_BASE64="${{ secrets.JWT_SECRET_QA || secrets.JWT_SECRET_BASE64 }}" \
                  TRYON_SERVICE_URL="${{ secrets.TRYON_SERVICE_URL_QA || 'https://styleradar-backend-qa.azurewebsites.net' }}" \
                  DONACIONES_SERVICE_URL="${{ secrets.DONACIONES_SERVICE_URL_QA || 'https://styleradar-donaciones-qa-jmunar.azurewebsites.net' }}" \
                  AUTH_SERVICE_URL="${{ secrets.AUTH_SERVICE_URL_QA || 'https://styleradar-backend-qa.azurewebsites.net' }}" \
                  TIENDAS_SERVICE_URL="${{ secrets.TIENDAS_SERVICE_URL_QA || 'https://styleradar-tiendas-qa.azurewebsites.net' }}"
            else
              echo "App Service $APP_NAME no encontrado en la suscripcion. Omitiendo appsettings."
            fi

      - uses: azure/webapps-deploy@v3
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_GATEWAY_QA || 'styleradar-gateway-qa' }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}

      - name: Smoke Test en Azure QA (Commit SHA y /actuator/health)
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          APP_NAME: ${{ secrets.AZURE_WEBAPP_GATEWAY_QA || 'styleradar-gateway-qa' }}
        run: |
          HEALTH_URL="https://${APP_NAME}.azurewebsites.net/actuator/health"
          INFO_URL="https://${APP_NAME}.azurewebsites.net/actuator/info"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Iniciando Smoke Test en QA. Validando commit esperado: $EXPECTED_SHA"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            INFO_BODY=$(curl -s "$INFO_URL" || true)
            echo "Intento $i: Health HTTP $STATUS | Actuator Info: $INFO_BODY"
            if [ "$STATUS" = "200" ] && echo "$INFO_BODY" | grep -q "$EXPECTED_SHA"; then
              echo "Smoke Test exitoso: Gateway respondiendo HTTP 200 y commit SHA verificado ($EXPECTED_SHA)"
              exit 0
            fi
            sleep 15
          done
          echo "Advertencia: El servicio no respondio con el SHA esperado en la ventana de prueba o aun esta iniciando."

