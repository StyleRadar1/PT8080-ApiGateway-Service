name: CI Pipeline · PT8080-ApiGateway-Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, JaCoCo (>= 85%) & SonarCloud (Gate A)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile, Test & Verify JaCoCo Quality Gate (>= 85%)
        run: ./mvnw clean verify -B

      - name: Run SonarQube / SonarCloud Quality Gate Analysis (Gate A Obligatorio)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARCLOUD_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.token="${{ secrets.SONAR_TOKEN || secrets.SONARCLOUD_TOKEN }}"

      - name: Upload JaCoCo HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  docker-build-check:
    name: Verify Docker Container Build (with Commit SHA)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI Image (Multi-stage verify)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: styleradar/pt8080-apigateway-service:latest
