# ===================================================================
# Perfil de Producción (PROD) - API Gateway StyleRadar
# Squad Portal8080 · Microsoft Azure App Service PaaS (Hardened)
# ===================================================================

server:
  port: ${PORT:${WEBSITES_PORT:${SERVER_PORT:8080}}}

# Microservicios enrutados en entorno Cloud PROD (Parametrización dinámica sin URLs fijas)
# Cada URL utiliza variable de entorno inyectable desde Azure App Settings con fallback al host activo
spring:
  cloud:
    gateway:
      routes:
        # Swagger OpenAPI Aggregator en PROD
        - id: ms-probador-virtual-swagger
          uri: ${TRYON_SERVICE_URL:${PROBADOR_SERVICE_URL:https://styleradar-virtualtryon-prod.azurewebsites.net}}
          predicates:
            - Path=/v3/api-docs/probador
          filters:
            - SetPath=/v3/api-docs

        - id: ms-donaciones-swagger
          uri: ${DONACIONES_SERVICE_URL:https://styleradar-donaciones-prod-jmunar.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/donaciones, /v3/api-docs/donations
          filters:
            - SetPath=/api/v1/v3/api-docs

        - id: ms-auth-swagger
          uri: ${AUTH_SERVICE_URL:https://styleradar-auth-prod.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: ms-tiendas-swagger
          uri: ${TIENDAS_SERVICE_URL:https://styleradar-tiendas-prod.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/tiendas
          filters:
            - SetPath=/v3/api-docs

        - id: ms-notificaciones-swagger
          uri: ${NOTIFICACIONES_SERVICE_URL:https://styleradar-notificaciones-prod.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/notificaciones
          filters:
            - SetPath=/v3/api-docs

        - id: ms-usuarios-swagger
          uri: ${USUARIOS_SERVICE_URL:https://styleradar-prod-app.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/usuarios
          filters:
            - SetPath=/v3/api-docs

        - id: ms-chat-swagger
          uri: ${CHAT_SERVICE_URL:https://gj-chat-service-prod-santi.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/chat
          filters:
            - SetPath=/v3/api-docs

        # Paquete 1: Identidad
        - id: ms-auth
          uri: ${AUTH_SERVICE_URL:https://styleradar-auth-prod.azurewebsites.net}
          predicates:
            - Path=/api/v1/auth/**

        - id: ms-tiendas
          uri: ${TIENDAS_SERVICE_URL:https://styleradar-tiendas-prod.azurewebsites.net}
          predicates:
            - Path=/api/v1/stores/**, /api/v1/foundations/**, /api/v1/tiendas/**, /api/v1/almacenes/**, /api/v1/admin/stores/**, /api/v1/admin/foundations/**

        - id: ms-usuarios
          uri: ${USUARIOS_SERVICE_URL:https://styleradar-prod-app.azurewebsites.net}
          predicates:
            - Path=/api/v1/usuarios/**, /api/v1/admin/usuarios/**, /api/v1/admin/**

        # Paquete 2: Catálogo (RESTrepo · Azure Container Apps)
        - id: ms-inventario
          uri: ${INVENTARIO_SERVICE_URL:https://rst-inventory-service-prod.redwave-74d6e30f.northcentralus.azurecontainerapps.io}
          predicates:
            - Path=/api/v1/inventario/**, /api/v1/inventory/**

        - id: ms-item-catalogo
          uri: ${CATALOGO_SERVICE_URL:https://rst-itemcatalog-service-prod.redwave-74d6e30f.northcentralus.azurecontainerapps.io}
          predicates:
            - Path=/api/v1/catalogo/**, /api/v1/prendas/**, /api/v1/catalog/**, /api/v1/items/**

        - id: ms-geolocalizacion
          uri: ${GEOLOCALIZACION_SERVICE_URL:https://rst-geolocation-service-prod.redwave-74d6e30f.northcentralus.azurecontainerapps.io}
          predicates:
            - Path=/api/v1/geolocalizacion/**, /api/v1/geolocation/**

        # ms-playlist
        - id: ms-playlist
          uri: ${PLAYLIST_SERVICE_URL:https://rst-playlist-service-prod.redwave-74d6e30f.northcentralus.azurecontainerapps.io}
          predicates:
            - Path=/api/v1/playlist/**, /api/v1/playlists/**

        # Paquete 3: Mensajería
        - id: ms-notificaciones
          order: -1
          uri: ${NOTIFICACIONES_SERVICE_URL:https://styleradar-notificaciones-prod.azurewebsites.net}
          predicates:
            - Path=/api/v1/notificaciones/**, /api/v1/notifications/**, /api/v1/usuarios/*/notificaciones/**, /api/v1/users/*/notifications/**, /api/v1/usuarios/*/notificaciones, /api/v1/users/*/notifications

        - id: ms-chat
          uri: ${CHAT_SERVICE_URL:https://gj-chat-service-prod-santi.azurewebsites.net}
          predicates:
            - Path=/api/v1/conversations/**, /api/v1/conversaciones/**, /api/v1/chat/**

        - id: ms-chat-ws
          uri: ${CHAT_WS_SERVICE_URL:wss://gj-chat-service-prod-santi.azurewebsites.net}
          predicates:
            - Path=/ws/**, /ws-chat/**, /ws, /ws-chat

        # Paquete 4: Pagos y Estadísticas
        - id: ms-pagos-suscripciones
          uri: ${PAGOS_SERVICE_URL:https://styleradar-pagos-prod.azurewebsites.net}
          predicates:
            - Path=/api/v1/pagos/**, /api/v1/payments/**, /api/v1/subscriptions/**

        - id: ms-estadisticas
          uri: ${ESTADISTICAS_SERVICE_URL:https://styleradar-estadisticas-prod.azurewebsites.net}
          predicates:
            - Path=/api/v1/estadisticas/**, /api/v1/statistics/**, /api/v1/analytics/**

        # Paquete 5: Experiencia y Donaciones
        - id: ms-probador-virtual
          uri: ${TRYON_SERVICE_URL:${PROBADOR_SERVICE_URL:https://styleradar-virtualtryon-prod.azurewebsites.net}}
          predicates:
            - Path=/api/v1/try-on/**, /api/v1/probador/**
          filters:
            - name: CircuitBreaker
              args:
                name: tryonCircuitBreaker
                fallbackUri: forward:/fallback/probador

        - id: ms-segunda-vida-donaciones
          uri: ${DONACIONES_SERVICE_URL:https://styleradar-donaciones-prod-jmunar.azurewebsites.net}
          predicates:
            - Path=/api/v1/donations/**, /api/v1/second-hand/**, /api/v1/donaciones/**, /api/v1/segunda-mano/**
          filters:
            - name: CircuitBreaker
              args:
                name: donacionesCircuitBreaker
                fallbackUri: forward:/fallback/general

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
    gateway:
      enabled: false

logging:
  level:
    root: WARN
    org.springframework.cloud.gateway: INFO
    edu.dosw.styleradar.gateway: INFO
