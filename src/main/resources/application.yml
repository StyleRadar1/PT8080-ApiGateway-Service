server:
  port: ${PORT:${WEBSITES_PORT:${SERVER_PORT:8080}}}

spring:
  application:
    name: pt8080-apigateway-service
  codec:
    max-in-memory-size: 2MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:8080"
              - "https://styleradar-qa.azurewebsites.net"
              - "https://styleradar-qa.vercel.app"
              - "https://styleradar-frontend-qa.azurewebsites.net"
              - "https://styleradar-gateway-qa.azurewebsites.net"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Retry-After"
              - "Authorization"
              - "WWW-Authenticate"
              - "Location"
            allowCredentials: true
            maxAge: 3600
      routes:
        # ==============================================================
        # 1. Enrutamiento y agregación de especificaciones OpenAPI / Swagger
        # ==============================================================
        # Swagger Probador Virtual (transforma /v3/api-docs/probador -> /v3/api-docs en :8500)
        - id: ms-probador-virtual-swagger
          uri: ${TRYON_SERVICE_URL:${PROBADOR_SERVICE_URL:http://localhost:8500}}
          predicates:
            - Path=/v3/api-docs/probador
          filters:
            - SetPath=/v3/api-docs

        # Swagger Donaciones (transforma /v3/api-docs/donaciones o /donations -> /api/v1/v3/api-docs en :8520)
        - id: ms-donaciones-swagger
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8520}
          predicates:
            - Path=/v3/api-docs/donaciones, /v3/api-docs/donations
          filters:
            - SetPath=/api/v1/v3/api-docs

        # Swagger Autenticación (transforma /v3/api-docs/auth -> /v3/api-docs en :8100)
        - id: ms-auth-swagger
          uri: ${AUTH_SERVICE_URL:http://localhost:8100}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        # Swagger Tiendas (transforma /v3/api-docs/tiendas -> /v3/api-docs en :8140)
        - id: ms-tiendas-swagger
          uri: ${TIENDAS_SERVICE_URL:http://localhost:8140}
          predicates:
            - Path=/v3/api-docs/tiendas
          filters:
            - SetPath=/v3/api-docs

        # Swagger Notificaciones (transforma /v3/api-docs/notificaciones -> /v3/api-docs en :8300)
        - id: ms-notificaciones-swagger
          uri: ${NOTIFICACIONES_SERVICE_URL:http://localhost:8300}
          predicates:
            - Path=/v3/api-docs/notificaciones
          filters:
            - SetPath=/v3/api-docs

        # Swagger Usuarios (transforma /v3/api-docs/usuarios -> /v3/api-docs en :8120)
        - id: ms-usuarios-swagger
          uri: ${USUARIOS_SERVICE_URL:http://localhost:8120}
          predicates:
            - Path=/v3/api-docs/usuarios
          filters:
            - SetPath=/v3/api-docs

        # Swagger Chat (transforma /v3/api-docs/chat -> /v3/api-docs en :8320)
        - id: ms-chat-swagger
          uri: ${CHAT_SERVICE_URL:http://localhost:8320}
          predicates:
            - Path=/v3/api-docs/chat
          filters:
            - SetPath=/v3/api-docs

        # Swagger Pagos y Suscripciones (transforma /v3/api-docs/pagos -> /v3/api-docs en :8400)
        - id: ms-pagos-swagger
          uri: ${PAGOS_SERVICE_URL:http://localhost:8400}
          predicates:
            - Path=/v3/api-docs/pagos
          filters:
            - SetPath=/v3/api-docs

        # ==============================================================
        # 2. Rutas de Microservicios de Negocio (Matriz Oficial de Puertos)
        # ==============================================================

        # --- PAQUETE 1: IDENTIDAD (CADche · Bloque 8100) ---
        # ms-auth: Autenticación, Login y OTP (Puerto 8100)
        - id: ms-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8100}
          predicates:
            - Path=/api/v1/auth/**

        # Rutas especificas de almacenes con prioridad sobre la ruta general de Tiendas
        - id: ms-geolocalizacion-almacenes
          order: -2
          uri: ${GEOLOCALIZACION_SERVICE_URL:http://localhost:8240}
          predicates:
            - Method=GET
            - Path=/api/v1/almacenes, /api/v1/almacenes/{id}/distancia, /api/v1/fundaciones/cercanas

        - id: ms-item-catalogo-almacenes
          order: -2
          uri: ${CATALOGO_SERVICE_URL:http://localhost:8220}
          predicates:
            - Method=GET
            - Path=/api/v1/almacenes/{id}/catalogo, /api/v1/almacenes/{id}/catalogo/resumen, /api/v1/almacenes/{id}/novedades
        # ms-chat-conversations: rutas de conversaciones bajo users/stores/donations/publications (prioridad -2)
        - id: ms-chat-conversations
          order: -2
          uri: ${CHAT_SERVICE_URL:http://localhost:8320}
          predicates:
            - Path=/api/v1/users/conversations, /api/v1/stores/conversations, /api/v1/stores/{nit}/conversations, /api/v1/donations/{donationId}/conversations, /api/v1/second-hand/publications/{publicationId}/conversations

        # ms-tiendas: Registro y Gestión de Almacenes Aliados y Fundaciones (Puerto 8140)
        - id: ms-tiendas
          order: -1
          uri: ${TIENDAS_SERVICE_URL:http://localhost:8140}
          predicates:
            - Path=/api/v1/stores, /api/v1/stores/**, /api/v1/foundations, /api/v1/foundations/**, /api/v1/users/*/store, /api/v1/admin/stores, /api/v1/admin/stores/**, /api/v1/admin/foundations, /api/v1/admin/foundations/**

        # ms-usuarios: Gestión de Usuarios y Perfiles (Puerto 8120)
        - id: ms-usuarios
          uri: ${USUARIOS_SERVICE_URL:http://localhost:8120}
          predicates:
            - Path=/api/v1/usuarios, /api/v1/usuarios/**, /api/v1/admin/usuarios, /api/v1/admin/usuarios/**

        # --- PAQUETE 2: CATÁLOGO (RESTrepo · Bloque 8200) ---
        # ms-inventario: Inventario por Talla (Puerto 8200)
        - id: ms-inventario
          uri: ${INVENTARIO_SERVICE_URL:http://localhost:8200}
          predicates:
            - Path=/api/v1/inventario, /api/v1/inventario/**

        # ms-item-catalogo: Catálogo de Prendas y Búsqueda (Puerto 8220)
        - id: ms-item-catalogo
          uri: ${CATALOGO_SERVICE_URL:http://localhost:8220}
          predicates:
            - Path=/api/v1/prendas, /api/v1/prendas/**, /api/v1/catalogo/items/**

        # ms-playlist: Listas de Prendas y Outfits (Puerto 8260)
        - id: ms-playlist
          uri: ${PLAYLIST_SERVICE_URL:http://localhost:8260}
          predicates:
            - Path=/api/v1/playlists, /api/v1/playlists/**

        # --- PAQUETE 3: MENSAJERÍA Y CHAT (Guatoque · Bloque 8300) ---
        # ms-notificaciones: Alertas y Notificaciones Push/Email (Puerto 8300)
        - id: ms-notificaciones
          order: -1
          uri: ${NOTIFICACIONES_SERVICE_URL:http://localhost:8300}
          predicates:
            - Path=/api/v1/users/*/notifications, /api/v1/users/*/notifications/**, /api/v1/users/*/alerts, /api/v1/users/*/alerts/**, /api/v1/users/*/notification-preferences, /api/v1/users/*/notification-preferences/**

        # ms-chat: Operaciones REST de Chat en Vivo y Mensajería (Puerto 8320)
        - id: ms-chat
          uri: ${CHAT_SERVICE_URL:http://localhost:8320}
          predicates:
            - Path=/api/v1/conversations, /api/v1/conversations/**

        # ms-chat-ws: Enrutamiento WebSocket en Tiempo Real con esquema ws:// (Puerto 8320)
        - id: ms-chat-ws
          uri: ${CHAT_WS_SERVICE_URL:${CHAT_SERVICE_WS_URL:ws://localhost:8320}}
          predicates:
            - Path=/ws, /ws/**, /ws-chat, /ws-chat/**

        # --- PAQUETE 4: PAGOS Y ESTADÍSTICAS (NQS · Bloque 8400) ---
        # ms-pagos-suscripciones: Pasarela de Pagos y Suscripciones (Puerto 8400)
        - id: ms-pagos-suscripciones
          order: -1
          uri: ${PAGOS_SERVICE_URL:http://localhost:8400}
          predicates:
            - Path=/api/v1/plans, /api/v1/payments/**, /api/v1/subscriptions/**, /api/v1/admin/payments, /api/v1/webhooks/mercadopago

        # ms-estadisticas: Métricas de Tráfico y Rendimiento (Puerto 8420)
        - id: ms-estadisticas
          uri: ${ESTADISTICAS_SERVICE_URL:http://localhost:8420}
          predicates:
            - Path=/api/v1/statistics/**

        # --- PAQUETE 5: EXPERIENCIA, DONACIONES Y PROBADOR (Portal 8080 · Bloque 8500) ---
        # ms-probador-virtual: Probador Virtual con IA FASHN VTON (Puerto 8500)
        - id: ms-probador-virtual
          uri: ${TRYON_SERVICE_URL:${PROBADOR_SERVICE_URL:http://localhost:8500}}
          predicates:
            - Path=/api/v1/try-on/**
          filters:
            - name: CircuitBreaker
              args:
                name: tryonCircuitBreaker
                fallbackUri: forward:/fallback/probador

        # ms-segunda-vida-donaciones: Donaciones y Moda Sostenible (Puerto 8520)
        - id: ms-segunda-vida-donaciones
          uri: ${DONACIONES_SERVICE_URL:http://localhost:8520}
          predicates:
            - Path=/api/v1/health, /api/v1/donations, /api/v1/donations/**, /api/v1/second-hand, /api/v1/second-hand/**
          filters:
            - name: CircuitBreaker
              args:
                name: donacionesCircuitBreaker
                fallbackUri: forward:/fallback/general

# Configuración de Actuator & Métricas (CVE-2025-41243 mitigado: endpoint gateway deshabilitado)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: false
  info:
    git:
      mode: full
    env:
      enabled: true

# Documentación OpenAPI Agregada
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "API Gateway (:8080)"
        url: "/v3/api-docs"
      - name: "ms-probador-virtual (:8500)"
        url: "/v3/api-docs/probador"
      - name: "ms-segunda-vida-donaciones (:8520)"
        url: "/v3/api-docs/donaciones"
      - name: "ms-auth (:8100)"
        url: "/v3/api-docs/auth"
      - name: "ms-tiendas (:8140)"
        url: "/v3/api-docs/tiendas"
      - name: "ms-notificaciones (:8300)"
        url: "/v3/api-docs/notificaciones"
      - name: "ms-usuarios (:8120)"
        url: "/v3/api-docs/usuarios"
      - name: "ms-chat (:8320)"
        url: "/v3/api-docs/chat"
      - name: "ms-pagos-suscripciones (:8400)"
        url: "/v3/api-docs/pagos"

# Seguridad JWT Perimetral (inyección limpia por variable de entorno, sin clave quemada)
security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:${JWT_SECRET:}}

# Resiliencia del CircuitBreaker para rutas con procesamiento pesado o cold-start en Azure (Try-On, Donaciones)
styleradar:
  gateway:
    circuit-breaker:
      timeout-seconds: ${GATEWAY_CIRCUIT_BREAKER_TIMEOUT_SECONDS:30}
