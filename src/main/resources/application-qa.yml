# ===================================================================
# Perfil de Calidad / Pruebas en Nube (QA) - API Gateway StyleRadar
# Squad Portal8080 · Microsoft Azure App Service PaaS
# ===================================================================

server:
  port: ${PORT:${WEBSITES_PORT:${SERVER_PORT:8080}}}

# Microservicios enrutados en entorno Cloud QA (Parametrización dinámica sin URLs fijas)
# Cada URL utiliza variable de entorno inyectable desde Azure App Settings con fallback al host activo
spring:
  cloud:
    gateway:
      routes:
        # Swagger OpenAPI Aggregator en QA
        - id: ms-probador-virtual-swagger
          uri: ${TRYON_SERVICE_URL:${PROBADOR_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}}
          predicates:
            - Path=/v3/api-docs/probador
          filters:
            - SetPath=/v3/api-docs

        - id: ms-donaciones-swagger
          uri: ${DONACIONES_SERVICE_URL:https://styleradar-donaciones-qa-jmunar.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/donaciones
          filters:
            - SetPath=/api/v1/v3/api-docs

        - id: ms-auth-swagger
          uri: ${AUTH_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: ms-tiendas-swagger
          uri: ${TIENDAS_SERVICE_URL:https://styleradar-tiendas-qa.azurewebsites.net}
          predicates:
            - Path=/v3/api-docs/tiendas
          filters:
            - SetPath=/v3/api-docs

        # Paquete 1: Identidad
        - id: ms-auth
          uri: ${AUTH_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/auth/**

        - id: ms-usuarios
          uri: ${USUARIOS_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/usuarios/**, /api/v1/admin/**

        - id: ms-tiendas
          uri: ${TIENDAS_SERVICE_URL:https://styleradar-tiendas-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/tiendas/**, /api/v1/almacenes/**

        # Paquete 2: Catálogo
        - id: ms-inventario
          uri: ${INVENTARIO_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/inventario/**

        - id: ms-item-catalogo
          uri: ${CATALOGO_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/catalogo/**, /api/v1/prendas/**

        - id: ms-geolocalizacion
          uri: ${GEOLOCALIZACION_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/geolocalizacion/**

        - id: ms-playlist
          uri: ${PLAYLIST_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/playlist/**

        # Paquete 3: Mensajería
        - id: ms-notificaciones
          uri: ${NOTIFICACIONES_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/notificaciones/**

        - id: ms-chat
          uri: ${CHAT_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/conversaciones/**, /api/v1/chat/**

        # Paquete 4: Pagos y Estadísticas
        - id: ms-pagos-suscripciones
          uri: ${PAGOS_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/pagos/**

        - id: ms-estadisticas
          uri: ${ESTADISTICAS_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}
          predicates:
            - Path=/api/v1/estadisticas/**

        # Paquete 5: Experiencia y Donaciones
        - id: ms-probador-virtual
          uri: ${TRYON_SERVICE_URL:${PROBADOR_SERVICE_URL:https://styleradar-backend-qa.azurewebsites.net}}
          predicates:
            - Path=/api/v1/try-on/**, /api/v1/probador/**
          filters:
            - name: CircuitBreaker
              args:
                name: tryonCircuitBreaker
                fallbackUri: forward:/fallback/probador

        - id: ms-segunda-vida-donaciones
          uri: ${DONACIONES_SERVICE_URL:https://styleradar-donaciones-qa-jmunar.azurewebsites.net}
          predicates:
            - Path=/api/v1/donaciones/**, /api/v1/segunda-mano/**
          filters:
            - name: CircuitBreaker
              args:
                name: donacionesCircuitBreaker
                fallbackUri: forward:/fallback/general

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    edu.dosw.styleradar.gateway: INFO

